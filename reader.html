<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reading — OpenShelf</title>

  <link rel="stylesheet" href="style.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .reader-page {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 16px 28px;

      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .reader-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .reader-title {
      font-weight: 700;
      font-size: 20px;
    }

    .back-button,
    .reader-theme {
      background: var(--surface);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: 10px;

      padding: 9px 14px;
      cursor: pointer;
    }

    .reader-container {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 55px 0 100px;
    }

    .reader-book-title {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.15;
    }

    .reader-author {
      margin-top: 12px;
      margin-bottom: 45px;
      opacity: 0.7;
      font-size: 17px;
    }

    #readerContent {
      background: var(--surface);
      color: var(--text);

      padding: 55px 65px;

      border-radius: 18px;
      border: 1px solid var(--border);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      line-height: 1.9;

      min-height: 70vh;
    }

    #readerContent * {
      background: transparent !important;
      color: var(--text) !important;
    }

    #readerContent p {
      margin: 0 0 24px;
    }

    #readerContent h1,
    #readerContent h2,
    #readerContent h3,
    #readerContent h4,
    #readerContent h5,
    #readerContent h6 {
      font-family: Georgia, "Times New Roman", serif;
      margin-top: 35px;
      margin-bottom: 18px;
      line-height: 1.3;
    }

    .progress-wrapper {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 4px;

      z-index: 2000;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    .loading-message {
      opacity: 0.7;
      text-align: center;
      padding: 50px 0;
    }

    .error-message {
      text-align: center;
      padding: 50px 0;
    }

    @media (max-width: 700px) {

      .reader-header {
        padding: 12px 16px;
      }

      .reader-title {
        display: none;
      }

      .reader-container {
        width: calc(100% - 20px);
        padding-top: 35px;
      }

      #readerContent {
        padding: 30px 22px;
        font-size: 17px;
        line-height: 1.8;
        border-radius: 12px;
      }
    }
  </style>
</head>

<body class="reader-page">

  <!-- READING PROGRESS -->

  <div class="progress-wrapper">
    <div id="progressBar"></div>
  </div>


  <!-- HEADER -->

  <header class="reader-header">

    <div class="reader-left">

      <button
        class="back-button"
        onclick="window.location.href='index.html'">
        ← Library
      </button>

      <div class="reader-title">
        OpenShelf
      </div>

    </div>


    <div class="reader-controls">

      <select id="readerTheme" class="reader-theme">
        <option value="light">☀️ Light</option>
        <option value="cozy">📚 Cozy Library</option>
        <option value="cafe">☕ Café & Books</option>
        <option value="editorial">📰 Editorial</option>
      </select>

    </div>

  </header>


  <!-- BOOK -->

  <main class="reader-container">

    <h1
      id="readerBookTitle"
      class="reader-book-title">
      Loading...
    </h1>

    <div
      id="readerAuthor"
      class="reader-author">
      Loading book information...
    </div>


    <article id="readerContent">

      <div class="loading-message">
        Loading book...
      </div>

    </article>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- MAMMOTH -->

  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js"></script>


  <script>

    // =========================
    // SUPABASE
    // =========================

    const SUPABASE_URL =
      "https://kdycmaicayaesnpkqfgp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_LC_ZkgE8N9p_t6d7KIhC_w_437ZMCFH";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =========================
    // ELEMENTS
    // =========================

    const titleElement =
      document.getElementById("readerBookTitle");

    const authorElement =
      document.getElementById("readerAuthor");

    const contentElement =
      document.getElementById("readerContent");

    const themeSelector =
      document.getElementById("readerTheme");

    const progressBar =
      document.getElementById("progressBar");


    // =========================
    // THEME
    // =========================

    const savedTheme =
      localStorage.getItem("openshelf-theme") || "light";

    document.body.setAttribute(
      "data-theme",
      savedTheme
    );

    themeSelector.value = savedTheme;


    themeSelector.addEventListener(
      "change",
      function () {

        const theme = this.value;

        document.body.setAttribute(
          "data-theme",
          theme
        );

        localStorage.setItem(
          "openshelf-theme",
          theme
        );

      }
    );


    // =========================
    // GET BOOK ID
    // =========================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const bookId =
      params.get("id");


    // =========================
    // LOAD BOOK
    // =========================

    async function loadBook() {

      if (!bookId) {

        showError(
          "No book was selected."
        );

        return;
      }


      try {

        const {
          data: book,
          error
        } = await supabaseClient
          .from("books")
          .select("*")
          .eq("id", bookId)
          .single();


        if (error) {
          throw error;
        }


        if (!book) {

          showError(
            "This book could not be found."
          );

          return;
        }


        // =========================
        // BOOK INFORMATION
        // =========================

        titleElement.textContent =
          book.title || "Untitled";

        authorElement.textContent =
          "By " +
          (book.author || "Unknown Author");


        // =========================
        // BOOK FILE
        // =========================

        if (!book.book_url) {

          showError(
            "This book does not have a readable file."
          );

          return;
        }


        contentElement.innerHTML = `
          <div class="loading-message">
            Opening book...
          </div>
        `;


        const response =
          await fetch(book.book_url);


        if (!response.ok) {

          throw new Error(
            "Could not download the book file."
          );

        }


        const arrayBuffer =
          await response.arrayBuffer();


        // =========================
        // DOCX → HTML
        // =========================

        const result =
          await mammoth.convertToHtml({
            arrayBuffer: arrayBuffer
          });


        contentElement.innerHTML =
          result.value;


        // =========================
        // PAGE TITLE
        // =========================

        document.title =
          `${book.title} — OpenShelf`;

      }

      catch (error) {

        console.error(
          "Reader error:",
          error
        );

        showError(
          "Sorry, this book could not be opened."
        );

      }

    }


    // =========================
    // ERROR
    // =========================

    function showError(message) {

      titleElement.textContent =
        "Unable to open book";

      authorElement.textContent =
        "";

      contentElement.innerHTML = `
        <div class="error-message">
          <p>${message}</p>

          <p>
            <button
              class="back-button"
              onclick="window.location.href='index.html'">
              ← Return to Library
            </button>
          </p>
        </div>
      `;

    }


    // =========================
    // READING PROGRESS
    // =========================

    window.addEventListener(
      "scroll",
      function () {

        const scrollTop =
          window.scrollY;

        const documentHeight =
          document.documentElement.scrollHeight -
          window.innerHeight;


        const progress =
          documentHeight > 0
            ? (scrollTop / documentHeight) * 100
            : 0;


        progressBar.style.width =
          progress + "%";

      }
    );


    // =========================
    // START
    // =========================

    loadBook();

  </script>

</body>
</html>
