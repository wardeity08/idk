<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reading — OpenShelf</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================
       READER PAGE
       ========================= */

    .reader-page {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      padding: 14px 5%;

      background: color-mix(
        in srgb,
        var(--bg) 90%,
        transparent
      );

      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .reader-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .back-button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);

      padding: 9px 15px;
      border-radius: 12px;

      cursor: pointer;
      font-size: 14px;
    }

    .back-button:hover {
      transform: translateY(-1px);
    }

    .reader-title {
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: 700;
    }

    .reader-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .reader-theme {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);

      padding: 9px 12px;
      border-radius: 12px;

      cursor: pointer;
      font-size: 14px;
    }

    .reader-container {
      width: min(850px, 90%);
      margin: 0 auto;
      padding: 55px 0 100px;
    }

    .reader-book-title {
      font-family: Georgia, serif;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1.05;
      margin-bottom: 12px;
    }

    .reader-author {
      color: var(--muted);
      margin-bottom: 45px;
    }

    .progress-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      z-index: 2000;
      background: transparent;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width .1s linear;
    }

    #readerContent {
      font-family: Georgia, serif;
      font-size: 19px;
      line-height: 1.9;
    }

    #readerContent h1,
    #readerContent h2,
    #readerContent h3 {
      font-family: Georgia, serif;
      margin-top: 55px;
      margin-bottom: 20px;
    }

    #readerContent p {
      margin-bottom: 22px;
    }

    #readerContent img {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 700px) {

      .reader-header {
        padding: 12px 4%;
      }

      .reader-title {
        display: none;
      }

      .reader-container {
        width: 90%;
        padding-top: 35px;
      }

      #readerContent {
        font-size: 17px;
        line-height: 1.8;
      }
    }
  </style>
</head>

<body class="reader-page">

  <div class="progress-wrapper">
    <div id="progressBar"></div>
  </div>

  <!-- HEADER -->

  <header class="reader-header">

    <div class="reader-left">

      <button
        class="back-button"
        onclick="window.location.href='index.html'">
        ← Library
      </button>

      <div class="reader-title">
        OpenShelf
      </div>

    </div>

    <!-- THEME SELECTOR -->

    <div class="reader-controls">

      <select id="readerTheme" class="reader-theme">
        <option value="light">☀️ Light</option>
        <option value="cozy">📚 Cozy Library</option>
        <option value="cafe">☕ Café & Books</option>
        <option value="editorial">📰 Editorial</option>
      </select>

    </div>

  </header>


  <!-- BOOK -->

  <main class="reader-container">

    <h1 class="reader-book-title">
      The Order Within
    </h1>

    <div class="reader-author">
      By Nikender Singh
    </div>

    <article id="readerContent">
      Loading book...
    </article>

  </main>


  <!-- MAMMOTH -->

  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js"></script>


  <script>

    const themeSelector =
      document.getElementById("readerTheme");


    // =========================
    // LOAD SAVED THEME
    // =========================

    const savedTheme =
      localStorage.getItem("openshelf-theme") || "light";

    document.body.setAttribute(
      "data-theme",
      savedTheme
    );

    themeSelector.value = savedTheme;


    // =========================
    // CHANGE THEME
    // =========================

    themeSelector.addEventListener(
      "change",
      function () {

        const theme =
          this.value;

        document.body.setAttribute(
          "data-theme",
          theme
        );

        // Save it so homepage
        // uses the same theme too

        localStorage.setItem(
          "openshelf-theme",
          theme
        );

      }
    );


    // =========================
    // LOAD BOOK
    // =========================

    const content =
      document.getElementById("readerContent");

    fetch(
      "THE%20ORDER%20WITHIN%20(1).docx"
    )

      .then(response => {

        if (!response.ok) {
          throw new Error(
            "Could not load the book."
          );
        }

        return response.arrayBuffer();

      })

      .then(arrayBuffer => {

        return mammoth.convertToHtml({
          arrayBuffer: arrayBuffer
        });

      })

      .then(result => {

        content.innerHTML =
          result.value;

      })

      .catch(error => {

        content.innerHTML = `
          <p>
            Sorry, the book could not be loaded.
          </p>
          <p>
            Please refresh the page and try again.
          </p>
        `;

        console.error(error);

      });


    // =========================
    // READING PROGRESS
    // =========================

    window.addEventListener(
      "scroll",
      function () {

        const scrollTop =
          window.scrollY;

        const documentHeight =
          document.documentElement.scrollHeight
          - window.innerHeight;

        const progress =
          documentHeight > 0
            ? (scrollTop / documentHeight) * 100
            : 0;

        document.getElementById(
          "progressBar"
        ).style.width =
          progress + "%";

      }
    );

  </script>

</body>
</html>
