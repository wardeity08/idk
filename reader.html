<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reading — OpenShelf</title>

  <link rel="stylesheet" href="style.css">

<style>
  /* FORCE READER TO FOLLOW OPENSHELF THEME */

  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
    background: var(--bg) !important;
    color: var(--text) !important;
  }

  .reader-page {
    min-height: 100vh !important;
    background: var(--bg) !important;
    color: var(--text) !important;
  }

  .reader-header {
    background: var(--bg) !important;
    color: var(--text) !important;
  }

  .reader-container {
    background: var(--bg) !important;
    color: var(--text) !important;
  }

  #readerContent {
    background: var(--bg) !important;
    color: var(--text) !important;

    width: 100%;
    min-height: 100vh;

    font-family: Georgia, serif;
    font-size: 19px;
    line-height: 1.9;
  }

  /* Override ANY background coming from the DOCX */

  #readerContent,
  #readerContent *,
  #readerContent p,
  #readerContent div,
  #readerContent span,
  #readerContent section,
  #readerContent article {
    background-color: transparent !important;
    color: var(--text) !important;
  }

  #readerContent h1,
  #readerContent h2,
  #readerContent h3,
  #readerContent h4,
  #readerContent h5,
  #readerContent h6 {
    color: var(--text) !important;
    background: transparent !important;
    font-family: Georgia, serif;
  }

  #readerContent p {
    margin-bottom: 22px;
  }

  .reader-theme {
    background: var(--surface) !important;
    color: var(--text) !important;
    border: 1px solid var(--border);
  }

  .back-button {
    background: var(--surface) !important;
    color: var(--text) !important;
    border: 1px solid var(--border);
  }

  /* Progress */

  .progress-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    z-index: 2000;
  }

  #progressBar {
    width: 0%;
    height: 100%;
    background: var(--accent);
  }

  @media (max-width: 700px) {
    #readerContent {
      font-size: 17px;
      line-height: 1.8;
    }
  }
</style>
</head>

<body class="reader-page">

  <div class="progress-wrapper">
    <div id="progressBar"></div>
  </div>

  <!-- HEADER -->

  <header class="reader-header">

    <div class="reader-left">

      <button
        class="back-button"
        onclick="window.location.href='index.html'">
        ← Library
      </button>

      <div class="reader-title">
        OpenShelf
      </div>

    </div>

    <!-- THEME SELECTOR -->

    <div class="reader-controls">

      <select id="readerTheme" class="reader-theme">
        <option value="light">☀️ Light</option>
        <option value="cozy">📚 Cozy Library</option>
        <option value="cafe">☕ Café & Books</option>
        <option value="editorial">📰 Editorial</option>
      </select>

    </div>

  </header>


  <!-- BOOK -->

  <main class="reader-container">

    <h1 class="reader-book-title">
      The Order Within
    </h1>

    <div class="reader-author">
      By Nikender Singh
    </div>

    <article id="readerContent">
      Loading book...
    </article>

  </main>


  <!-- MAMMOTH -->

  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js"></script>


  <script>

    const themeSelector =
      document.getElementById("readerTheme");


    // =========================
    // LOAD SAVED THEME
    // =========================

    const savedTheme =
      localStorage.getItem("openshelf-theme") || "light";

    document.body.setAttribute(
      "data-theme",
      savedTheme
    );

    themeSelector.value = savedTheme;


    // =========================
    // CHANGE THEME
    // =========================

    themeSelector.addEventListener(
      "change",
      function () {

        const theme =
          this.value;

        document.body.setAttribute(
          "data-theme",
          theme
        );

        // Save it so homepage
        // uses the same theme too

        localStorage.setItem(
          "openshelf-theme",
          theme
        );

      }
    );


    // =========================
    // LOAD BOOK
    // =========================

    const content =
      document.getElementById("readerContent");

    fetch(
      "THE%20ORDER%20WITHIN%20(1).docx"
    )

      .then(response => {

        if (!response.ok) {
          throw new Error(
            "Could not load the book."
          );
        }

        return response.arrayBuffer();

      })

      .then(arrayBuffer => {

        return mammoth.convertToHtml({
          arrayBuffer: arrayBuffer
        });

      })

      .then(result => {

        content.innerHTML =
          result.value;

      })

      .catch(error => {

        content.innerHTML = `
          <p>
            Sorry, the book could not be loaded.
          </p>
          <p>
            Please refresh the page and try again.
          </p>
        `;

        console.error(error);

      });


    // =========================
    // READING PROGRESS
    // =========================

    window.addEventListener(
      "scroll",
      function () {

        const scrollTop =
          window.scrollY;

        const documentHeight =
          document.documentElement.scrollHeight
          - window.innerHeight;

        const progress =
          documentHeight > 0
            ? (scrollTop / documentHeight) * 100
            : 0;

        document.getElementById(
          "progressBar"
        ).style.width =
          progress + "%";

      }
    );

  </script>

</body>
</html>
